name: Deploy to All-Inkl

on:
  push:
    branches:
      - main
      - claude/build-loggyship-mvp-BOSPC
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: DCS Studio KAS FTP

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare .env
        run: cp .env.production .env

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          exclude: |
            **/.git*
            **/.git*/**
            node_modules/**
            screenshots/**
            tests/**
            .env.production
            deploy.sh
            package.json
            package-lock.json
            vite.config.js
            resources/css/**
            resources/js/**
