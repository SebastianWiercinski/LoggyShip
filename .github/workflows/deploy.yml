name: Deploy to All-Inkl

on:
  push:
    branches:
      - main
      - claude/build-loggyship-mvp-BOSPC
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: DCS Studio KAS FTP
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare .env
        run: cp .env.production .env

      - name: Test FTP connection
        run: |
          echo "Testing DNS..."
          nslookup "$FTP_HOST" || true
          echo "Testing FTP..."
          curl -v --connect-timeout 10 "ftp://${FTP_HOST}/" --user "${FTP_USER}:${FTP_PASS}" 2>&1 | head -20 || true

      - name: Deploy via LFTP
        run: |
          sudo apt-get install -y -qq lftp
          lftp -u "${FTP_USER},${FTP_PASS}" "ftp://${FTP_HOST}" <<'LFTP_SCRIPT'
            set ftp:ssl-allow yes
            set ssl:verify-certificate no
            set net:timeout 30
            set net:max-retries 4
            set mirror:parallel-transfer-count 5
            mirror --reverse --delete --verbose \
              --exclude .git/ \
              --exclude .github/ \
              --exclude node_modules/ \
              --exclude screenshots/ \
              --exclude tests/ \
              --exclude .env.production \
              --exclude deploy.sh \
              --exclude package.json \
              --exclude package-lock.json \
              --exclude vite.config.js \
              --exclude resources/css/ \
              --exclude resources/js/
            bye
          LFTP_SCRIPT
