name: Deploy to All-Inkl

on:
  push:
    branches:
      - main
      - claude/build-loggyship-mvp-BOSPC
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: DCS Studio KAS FTP

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare .env
        run: cp .env.production .env

      - name: Verify secrets are available
        run: |
          if [ -z "${{ secrets.FTP_HOST }}" ]; then echo "FTP_HOST is empty!"; exit 1; fi
          if [ -z "${{ secrets.FTP_USER }}" ]; then echo "FTP_USER is empty!"; exit 1; fi
          if [ -z "${{ secrets.FTP_PASS }}" ]; then echo "FTP_PASS is empty!"; exit 1; fi
          echo "All secrets available. Testing DNS..."
          nslookup ${{ secrets.FTP_HOST }} || echo "DNS lookup failed"
          echo "Testing FTP connection..."
          curl -v --connect-timeout 10 ftp://${{ secrets.FTP_HOST }}/ -u "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASS }}" 2>&1 | head -20 || true

      - name: Deploy via LFTP
        run: |
          sudo apt-get install -y lftp
          lftp -e "
            set ftp:ssl-allow yes
            set ssl:verify-certificate no
            set net:timeout 30
            set net:max-retries 4
            set mirror:parallel-transfer-count 5
            mirror --reverse --delete --verbose \
              --exclude .git/ \
              --exclude .github/ \
              --exclude node_modules/ \
              --exclude screenshots/ \
              --exclude tests/ \
              --exclude .env.production \
              --exclude deploy.sh \
              --exclude package.json \
              --exclude package-lock.json \
              --exclude vite.config.js \
              --exclude resources/css/ \
              --exclude resources/js/ \
              ./ ./
            bye
          " -u "${{ secrets.FTP_USER }},${{ secrets.FTP_PASS }}" "ftp://${{ secrets.FTP_HOST }}"
